name: Release

# Two ways to cut a release:
#   1. Tag-driven:  git tag v1.2.3 && git push origin v1.2.3
#   2. Manual:      Actions → Release → Run workflow → enter "1.2.3"
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release (and tag, on manual runs)
  packages: write   # publish + delete package versions

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@sebastienaglae'

      # Resolve the version + tag from either the pushed tag or the manual input
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"   >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=v$VERSION"

      - name: Set package version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Verify before publish
        run: npm run check && npm run smoke

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Creates the tag too when run manually (it doesn't exist yet)
      - name: Create GitHub Release
        run: gh release create "${{ steps.ver.outputs.tag }}" --target "$GITHUB_SHA" --title "${{ steps.ver.outputs.tag }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # keep ONLY the version we just published; delete all older ones
      - name: Prune old package versions (keep latest only)
        uses: actions/delete-package-versions@v5
        continue-on-error: true   # no-op on the very first publish
        with:
          package-name: aura
          package-type: npm
          min-versions-to-keep: 1
