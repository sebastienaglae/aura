name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Syntax check
        run: npm run check

      - name: Module loads & exports are present
        run: npm run smoke

      - name: Validate package can be packed
        run: npm pack --dry-run
